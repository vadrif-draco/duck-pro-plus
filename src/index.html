<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Duck Pro+</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon/frame_00.gif" />
  </head>
  <body>
    <app-root></app-root>
  </body>
  <script>
    const favicon_icon_tag = document.querySelector("link[rel='icon']");
    const favicon_frames = Array.from({ length: 17 }, (_, i) => {
      return `favicon/${i.toString().padStart(2, "0")}.gif`;
    });
    setInterval(function () {
      favicon_icon_tag.href = favicon_frames[(parseInt(favicon_icon_tag.href.match(/(\d+)\.gif/)[1]) + 1) % favicon_frames.length];
    }, 133);
  </script>
</html>
